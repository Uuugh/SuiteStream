# Analyzer configuration (PBI-048). Strict modes plus seven extra lints on top of
# flutter_lints. The seven lints are warnings, so `flutter analyze lib test` fails on them.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    prefer_const_constructors: warning
    avoid_print: warning
    unawaited_futures: warning
    prefer_final_locals: warning
    always_declare_return_types: warning
    avoid_catches_without_on_clauses: warning
    always_use_package_imports: warning

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
    unawaited_futures: true
    prefer_final_locals: true
    always_declare_return_types: true
    avoid_catches_without_on_clauses: true
    always_use_package_imports: true
