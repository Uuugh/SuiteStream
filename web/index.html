<!DOCTYPE html>
<html>
<head>
  <!--
    The base href below is replaced by the value of the `--base-href` argument
    given to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SuiteStream calendar">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SuiteStream">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SuiteStream</title>
  <link rel="manifest" href="manifest.json">

  <!--
    SHL-03: the saved theme (Light / Dark / Match system) is read before anything is drawn,
    so the page never shows the other theme first. shared_preferences keeps the choice in
    localStorage as flutter.theme.mode, a JSON string.
  -->
  <script>
    (function () {
      var mode = 'system';
      try {
        var raw = window.localStorage.getItem('flutter.theme.mode');
        var saved = raw === null ? null : JSON.parse(raw);
        if (saved === 'light' || saved === 'dark') mode = saved;
      } catch (e) { /* unreadable storage: Match system */ }
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <style>
    :root { --bg: #ffffff; --fg: #1b1b1f; --muted: #5c5f66; --accent: #3b6fd4; --err: #b3261e; }
    :root[data-theme="dark"] { --bg: #121316; --fg: #e3e2e6; --muted: #a9abb3; --accent: #93b4ff; --err: #ffb4ab; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 0; }
    #boot .spinner { width: 36px; height: 36px; border: 4px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #boot-message { color: var(--muted); font-size: 14px; }
    #boot-error { display: none; max-width: 640px; text-align: left; }
    #boot-error h1 { font-size: 20px; color: var(--err); margin: 0 0 8px; }
    #boot-error pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; margin: 8px 0; }
    #boot.failed .spinner, #boot.failed #boot-message { display: none; }
    #boot.failed #boot-error { display: block; }
    /* Flutter's view is added to the body after the boot screen and covers it once it renders. */
    flutter-view, flt-glass-pane { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div id="boot" role="status">
    <div class="spinner"></div>
    <div id="boot-message">Loading SuiteStream...</div>
    <div id="boot-error">
      <h1>SuiteStream could not start</h1>
      <div id="boot-error-detail"></div>
      <div>Hard refresh with Ctrl+Shift+R. If it persists, unregister the service worker and clear the site data for this address.</div>
    </div>
  </div>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      var detail = document.getElementById('boot-error-detail');
      var message = document.getElementById('boot-message');
      function fail(text) {
        if (!boot) return;
        var pre = document.createElement('pre');
        pre.textContent = text;
        detail.appendChild(pre);
        boot.className = 'failed';
      }
      window.suiteStreamBootFailed = fail;
      // Reports script errors that happen before Flutter shows anything.
      window.addEventListener('error', function (e) {
        if (boot && boot.parentNode) fail((e.message || 'Script error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (boot && boot.parentNode) fail('Unhandled error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      // Removes the boot screen once Flutter has drawn its first frame.
      window.addEventListener('flutter-first-frame', function () {
        if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        clearTimeout(slow);
        clearTimeout(timeout);
      });
      var slow = setTimeout(function () {
        message.textContent = 'Still loading... this is taking longer than usual.';
      }, 8000);
      var timeout = setTimeout(function () {
        if (boot && boot.parentNode && boot.className !== 'failed') {
          fail('Timed out after 30 seconds waiting for the app to start. The files may not have loaded (check the network tab), or an old service worker may be serving stale files.');
        }
      }, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
