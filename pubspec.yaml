name: suitestream
description: "SuiteStream: calendars, feeds and sync in one place."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - requirements/messages/
    - assets/images/logo/mark-light-72.png
    - assets/images/logo/mark-dark-72.png
    - assets/fonts/LICENSE-MaterialSymbolsRounded.txt
    - assets/fonts/NOTICE-MaterialSymbolsRounded.txt
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
    - family: Material Symbols Rounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
